<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' style='stop-color:%234FA383;stop-opacity:1' /><stop offset='100%' style='stop-color:%2365B74A;stop-opacity:1' /></linearGradient></defs><rect width='100' height='100' fill='%23101319' /><circle cx='50' cy='50' r='45' fill='url(%23g)' /><text x='50' y='65' font-size='55' font-weight='bold' text-anchor='middle' fill='%23E8E6E0' font-family='Arial'>€</text></svg>">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mis Cuentas">
<meta name="theme-color" content="#101319">
<link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxODAgMTgwIj48cmVjdCB3aWR0aD0iMTgwIiBoZWlnaHQ9IjE4MCIgZmlsbD0iIzEwMTMxOSIvPjxyZWN0IHg9IjMyIiB5PSI2NCIgd2lkdGg9IjExNiIgaGVpZ2h0PSIxNCIgcng9IjciIGZpbGw9IiM0RkEzODMiLz48cmVjdCB4PSIzMiIgeT0iMTAyIiB3aWR0aD0iNzQiIGhlaWdodD0iMTQiIHJ4PSI3IiBmaWxsPSIjQjA2NThBIi8+PC9zdmc+">
<title>Mis Cuentas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#101319; --panel:#191D25; --panel2:#212630;
    --paper:#E8E6E0; --dim:#8D93A0;
    --in:#4FA383; --out:#B0658A;
    --line:rgba(232,230,224,.12);
    --ui:'Space Grotesk',system-ui,-apple-system,sans-serif;
    --num:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--ink);color:var(--paper);font-family:var(--ui);
    font-size:15px;line-height:1.45;
    padding-bottom:env(safe-area-inset-bottom);
    -webkit-font-smoothing:antialiased;
  }
  .num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

  /* cabecera */
  header{
    position:sticky;top:0;z-index:40;background:rgba(16,19,25,.94);
    backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
    display:flex;align-items:center;gap:12px;
  }
  #burger{
    background:none;border:1px solid var(--line);color:var(--paper);
    width:38px;height:38px;border-radius:11px;font-size:17px;flex:none;cursor:pointer;
  }
  header h1{font-size:16px;font-weight:500;margin:0;letter-spacing:-.01em}
  header .vista{color:var(--dim);font-size:13px;margin-left:auto}

  /* menú lateral */
  #veil{position:fixed;inset:0;background:rgba(8,9,12,.6);opacity:0;pointer-events:none;transition:opacity .22s;z-index:60}
  #veil.on{opacity:1;pointer-events:auto}
  nav#drawer{
    position:fixed;top:0;bottom:0;left:0;width:272px;max-width:82vw;z-index:70;
    background:var(--panel);border-right:1px solid var(--line);
    transform:translateX(-101%);transition:transform .24s cubic-bezier(.3,.8,.3,1);
    padding:calc(env(safe-area-inset-top) + 22px) 14px 22px;overflow-y:auto;
  }
  nav#drawer.on{transform:none}
  .who{padding:0 8px 18px;border-bottom:1px solid var(--line);margin-bottom:14px}
  .who .nm{font-size:19px;font-weight:700;letter-spacing:-.02em}
  .who .bal{font-family:var(--num);font-size:13px;color:var(--dim);margin-top:4px}
  nav button.tab{
    display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    background:none;border:none;color:var(--paper);font-family:var(--ui);font-size:15px;
    padding:12px 10px;border-radius:11px;cursor:pointer;
  }
  nav button.tab .ic{width:22px;text-align:center;font-size:16px}
  nav button.tab[aria-current="true"]{background:var(--panel2);font-weight:500}

  main{padding:18px 16px 108px;max-width:640px;margin:0 auto}

  /* selector de mes */
  .mes{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .mes button{
    background:var(--panel);border:1px solid var(--line);color:var(--paper);
    width:34px;height:34px;border-radius:10px;font-size:15px;cursor:pointer;flex:none;
  }
  .mes .lbl{font-size:16px;font-weight:500;text-transform:capitalize;flex:1;text-align:center}

  /* balance: dos flujos enfrentados */
  .flujo{margin:4px 0 26px}
  .flujo .fila{margin-bottom:14px}
  .flujo .cap{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .flujo .cap span:first-child{font-size:13.5px;color:var(--dim)}
  .flujo .cap .v{font-family:var(--num);font-size:17px;font-weight:500}
  .barra{height:12px;border-radius:3px;background:var(--panel2);overflow:hidden}
  .barra i{display:block;height:100%;border-radius:3px;transition:width .35s ease}
  .neto{
    display:flex;justify-content:space-between;align-items:baseline;
    border-top:1px solid var(--line);padding-top:14px;margin-top:20px;
  }
  .neto .t{font-size:14px;color:var(--dim)}
  .neto .v{font-family:var(--num);font-size:30px;font-weight:600;letter-spacing:-.025em}

  h2{font-size:14.5px;font-weight:500;color:var(--dim);margin:26px 0 12px}

  /* filas de categoría */
  .cat{display:flex;align-items:center;gap:11px;padding:10px 0}
  .cat .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:15px;flex:none}
  .cat .body{flex:1;min-width:0}
  .cat .body .l1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .cat .body .nm{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cat .body .am{font-family:var(--num);font-size:14px;flex:none}
  .cat .body .b{height:5px;border-radius:99px;background:var(--panel2);margin-top:6px;overflow:hidden}
  .cat .body .b i{display:block;height:100%;border-radius:99px}
  .cat .pc{font-family:var(--num);font-size:11.5px;color:var(--dim);width:38px;text-align:right;flex:none}

  /* movimientos */
  .dia{display:flex;align-items:baseline;gap:10px;margin:22px 0 4px}
  .dia .d{font-size:13px;color:var(--dim);text-transform:capitalize}
  .dia .s{font-family:var(--num);font-size:12px;color:var(--dim);margin-left:auto}
  .mov{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
  .mov .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:16px;flex:none}
  .mov .txt{flex:1;min-width:0}
  .mov .txt .nm{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mov .txt .no{font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mov .am{font-family:var(--num);font-size:15px;font-weight:500;flex:none}
  .mov .x{background:none;border:none;color:var(--dim);font-size:17px;padding:2px 0 2px 8px;cursor:pointer;flex:none}

  /* vacío */
  .vacio{border:1px dashed var(--line);border-radius:14px;padding:26px 20px;text-align:center}
  .vacio p{margin:0 0 14px;color:var(--dim);font-size:14px}

  /* botón añadir */
  #fab{
    position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 20px);z-index:45;
    height:52px;padding:0 22px 0 18px;border:none;border-radius:16px;cursor:pointer;
    background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:15px;font-weight:500;
    display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  #fab b{font-size:20px;font-weight:400;line-height:1}

  /* formularios y modal */
  #modal{position:fixed;inset:0;z-index:80;display:none}
  #modal.on{display:block}
  #modal .bg{position:absolute;inset:0;background:rgba(8,9,12,.66)}
  #modal .sheet{
    position:absolute;left:0;right:0;bottom:0;background:var(--panel);
    border-radius:20px 20px 0 0;border-top:1px solid var(--line);
    padding:20px 18px calc(env(safe-area-inset-bottom) + 22px);
    max-height:92vh;overflow-y:auto;max-width:640px;margin:0 auto;
  }
  #modal .sheet h3{margin:0 0 18px;font-size:17px;font-weight:500}
  .seg{display:flex;gap:8px;margin-bottom:16px}
  .seg button{
    flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);cursor:pointer;
    background:var(--panel2);color:var(--dim);font-family:var(--ui);font-size:14.5px;
  }
  .seg button.on{color:var(--ink);font-weight:500;border-color:transparent}
  label{display:block;font-size:13px;color:var(--dim);margin:14px 0 6px}
  input,select,textarea{
    width:100%;padding:13px 14px;border-radius:12px;background:var(--panel2);
    border:1px solid var(--line);color:var(--paper);font-family:var(--ui);font-size:16px;
  }
  input.imp{font-family:var(--num);font-size:30px;font-weight:600;text-align:center;padding:16px 14px}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
  .btn{
    width:100%;padding:15px;border:none;border-radius:13px;margin-top:20px;cursor:pointer;
    background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:15.5px;font-weight:500;
  }
  .btn.ghost{background:var(--panel2);color:var(--paper);border:1px solid var(--line);margin-top:10px}
  .btn.peligro{background:none;border:1px solid var(--out);color:var(--out)}
  .aviso{color:var(--out);font-size:13px;margin:10px 0 0;min-height:18px}

  /* evolución: rango */
  .rango{display:flex;gap:8px;margin-bottom:20px}
  .rango button{
    flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);cursor:pointer;
    background:var(--panel);color:var(--dim);font-family:var(--ui);font-size:13.5px;
  }
  .rango button.on{background:var(--panel2);color:var(--paper);font-weight:500}

  /* evolución: columnas de ahorro */
  .cabAhorro{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
  .cabAhorro .v{font-family:var(--num);font-size:26px;font-weight:600;letter-spacing:-.02em}
  .cabAhorro .t{font-size:13.5px;color:var(--dim);max-width:52%}
  .evo{display:flex;gap:5px;align-items:stretch;margin-bottom:6px}
  .evo .col{flex:1;display:flex;flex-direction:column;min-width:0}
  .evo .zona{display:flex;flex-direction:column;height:132px}
  .evo .up{display:flex;align-items:flex-end}
  .evo .dn{display:flex;align-items:flex-start;border-top:1px solid var(--line)}
  .evo .pil{width:100%;border-radius:3px 3px 0 0;min-height:2px}
  .evo .dn .pil{border-radius:0 0 3px 3px}
  .evo .lab{text-align:center;padding-top:7px;border-top:1px solid var(--line)}
  .evo .col.act .lab{border-top-color:var(--paper)}
  .evo .lab .m{font-size:11.5px;color:var(--dim);text-transform:capitalize}
  .evo .col.act .lab .m{color:var(--paper)}
  .evo .lab .p{font-family:var(--num);font-size:11px;font-weight:500;margin-top:1px}
  .evo.compacta{gap:3px}
  .evo.compacta .lab .m{font-size:9.5px}
  .evo.compacta .lab .p{font-size:9px}
  .nota{font-size:12.5px;color:var(--dim);margin:12px 0 0}

  /* evolución: tendencia por categoría */
  .tend{display:flex;align-items:center;gap:11px;width:100%;padding:12px 0;border-bottom:1px solid var(--line);
    background:none;border-left:none;border-right:none;border-top:none;color:var(--paper);
    font-family:var(--ui);text-align:left;cursor:pointer}
  .tend .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:15px;flex:none}
  .tend .mid{flex:1;min-width:0}
  .tend .mid .l1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .tend .mid .nm{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tend .mid .tt{font-family:var(--num);font-size:13.5px;flex:none}
  .spark{display:flex;gap:2px;align-items:flex-end;height:26px;margin-top:7px}
  .spark i{flex:1;border-radius:2px 2px 0 0;min-height:2px;opacity:.55}
  .spark i.ult{opacity:1}
  .delta{font-family:var(--num);font-size:11.5px;width:52px;text-align:right;flex:none}
  .detalle{padding:4px 0 14px 43px;border-bottom:1px solid var(--line)}
  .detalle .r{display:flex;justify-content:space-between;padding:5px 0;font-size:13px}
  .detalle .r span:first-child{color:var(--dim);text-transform:capitalize}
  .detalle .r span:last-child{font-family:var(--num)}

  .caja{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .caja h3{margin:0 0 6px;font-size:15px;font-weight:500}
  .caja p{margin:0;color:var(--dim);font-size:13.5px}
  .fila2{display:flex;gap:10px}
  .fila2 > *{flex:1}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="veil"></div>
<nav id="drawer">
  <div class="who">
    <div class="nm">Mis Cuentas</div>
    <div class="bal" id="dwBal">—</div>
  </div>
  <button class="tab" data-v="resumen"><span class="ic">◐</span> Resumen</button>
  <button class="tab" data-v="evo"><span class="ic">◪</span> Evolución</button>
  <button class="tab" data-v="movs"><span class="ic">☰</span> Movimientos</button>
  <button class="tab" data-v="cats"><span class="ic">◈</span> Categorías</button>
  <button class="tab" data-v="ajustes"><span class="ic">⚙</span> Ajustes</button>
</nav>

<header>
  <button id="burger" aria-label="Abrir menú">☰</button>
  <h1>Mis Cuentas</h1>
  <span class="vista" id="hVista"></span>
</header>

<main id="app"></main>

<button id="fab"><b>+</b> Añadir</button>

<div id="modal"><div class="bg"></div><div class="sheet" id="sheet"></div></div>

<script>
/* ============================================================
   1. ALMACENAMIENTO  (única capa a cambiar para meter Supabase)
   ============================================================ */
const KEY = 'cuentas:v1';
const disco = {
  async leer(){
    try{
      if(window.storage){ const r = await window.storage.get(KEY); return r ? r.value : null; }
      return localStorage.getItem(KEY);
    }catch(e){ return null; }
  },
  async escribir(txt){
    try{
      if(window.storage){ await window.storage.set(KEY, txt); return; }
    }catch(e){}
    try{ localStorage.setItem(KEY, txt); }catch(e){}
  }
};

/* ============================================================
   2. ESTADO
   ============================================================ */
const CATS_INICIALES = [
  {id:'c1',  nombre:'Alquiler',      tipo:'gasto',   color:'#B0658A', icono:'🏠'},
  {id:'c2',  nombre:'Compra',        tipo:'gasto',   color:'#C67C4E', icono:'🛒'},
  {id:'c3',  nombre:'Restaurantes',  tipo:'gasto',   color:'#C9564F', icono:'🍽'},
  {id:'c4',  nombre:'Transporte',    tipo:'gasto',   color:'#5C7FB8', icono:'🚌'},
  {id:'c5',  nombre:'Suscripciones', tipo:'gasto',   color:'#8A6FB5', icono:'📺'},
  {id:'c6',  nombre:'Gimnasio',      tipo:'gasto',   color:'#4E8FA0', icono:'🏋'},
  {id:'c7',  nombre:'Viajes',        tipo:'gasto',   color:'#B58A4E', icono:'✈️'},
  {id:'c8',  nombre:'Ocio',          tipo:'gasto',   color:'#9C6BA8', icono:'🎬'},
  {id:'c9',  nombre:'Salud',         tipo:'gasto',   color:'#6FA88F', icono:'💊'},
  {id:'c10', nombre:'Otros gastos',  tipo:'gasto',   color:'#7C8290', icono:'•'},
  {id:'i1',  nombre:'Nómina',        tipo:'ingreso', color:'#4FA383', icono:'💼'},
  {id:'i2',  nombre:'Variable',      tipo:'ingreso', color:'#5EA36F', icono:'📈'},
  {id:'i3',  nombre:'Otros ingresos',tipo:'ingreso', color:'#6E9E86', icono:'+'}
];

let S = { movs:[], cats:CATS_INICIALES.slice(), seq:1 };
let vista = 'resumen';
let ym = hoyISO().slice(0,7);
let rango = 6;                  // meses que mira la vista Evolución
let abiertas = new Set();       // categorías desplegadas en Evolución

function hoyISO(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}

async function cargar(){
  const txt = await disco.leer();
  if(!txt) return;
  try{
    const d = JSON.parse(txt);
    if(Array.isArray(d.movs)) S.movs = d.movs;
    if(Array.isArray(d.cats) && d.cats.length) S.cats = d.cats;
    if(typeof d.seq === 'number') S.seq = d.seq;
  }catch(e){}
}
function guardar(){ disco.escribir(JSON.stringify(S)); }

/* ============================================================
   3. DINERO  — todo en céntimos, enteros, sin decimales flotantes
   ============================================================ */
const euro = new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'});
function fmt(c){ return euro.format(c/100); }
function fmtFirmado(c){ return (c>0?'+':c<0?'−':'') + euro.format(Math.abs(c)/100); }

function aCentimos(txt){
  const limpio = String(txt).trim().replace(/[^\d.,-]/g,'').replace(/\./g,'#').replace(/,/g,'.').replace(/#/g,'');
  const n = parseFloat(limpio);
  if(!isFinite(n) || n <= 0) return null;
  return Math.round(n*100);
}

/* ============================================================
   4. CONSULTAS
   ============================================================ */
function delMes(m){ return S.movs.filter(x => x.fecha.slice(0,7) === m); }
function suma(arr,tipo){ return arr.filter(x => x.tipo === tipo).reduce((a,b) => a+b.cents, 0); }
function cat(id){ return S.cats.find(c => c.id === id) || {nombre:'Sin categoría',color:'#7C8290',icono:'?'}; }
function nombreMes(m){
  const [y,mm] = m.split('-').map(Number);
  return new Date(y,mm-1,1).toLocaleDateString('es-ES',{month:'long',year:'numeric'});
}
function moverMes(paso){
  const [y,mm] = ym.split('-').map(Number);
  const d = new Date(y,mm-1+paso,1);
  ym = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  pintar();
}

/* ============================================================
   5. VISTAS
   ============================================================ */
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function barraMes(){
  return '<div class="mes">'+
    '<button onclick="moverMes(-1)" aria-label="Mes anterior">‹</button>'+
    '<div class="lbl">'+nombreMes(ym)+'</div>'+
    '<button onclick="moverMes(1)" aria-label="Mes siguiente">›</button></div>';
}

function vResumen(){
  const m = delMes(ym), ing = suma(m,'ingreso'), gas = suma(m,'gasto');
  const tope = Math.max(ing,gas,1), neto = ing-gas;

  let h = barraMes();

  if(!m.length){
    h += '<div class="vacio"><p>Todavía no hay nada apuntado en '+nombreMes(ym)+'.</p>'+
         '<button class="btn" onclick="abrirMov()">Apuntar el primer movimiento</button></div>';
    return h;
  }

  h += '<div class="flujo">'+
    '<div class="fila"><div class="cap"><span>Ingresos</span><span class="v" style="color:var(--in)">'+fmt(ing)+'</span></div>'+
    '<div class="barra"><i style="width:'+(ing/tope*100)+'%;background:var(--in)"></i></div></div>'+
    '<div class="fila"><div class="cap"><span>Gastos</span><span class="v" style="color:var(--out)">'+fmt(gas)+'</span></div>'+
    '<div class="barra"><i style="width:'+(gas/tope*100)+'%;background:var(--out)"></i></div></div>'+
    '<div class="neto"><span class="t">Balance del mes</span>'+
    '<span class="v" style="color:'+(neto<0?'var(--out)':'var(--in)')+'">'+fmtFirmado(neto)+'</span></div></div>';

  ['gasto','ingreso'].forEach(tipo => {
    const total = tipo === 'gasto' ? gas : ing;
    if(!total) return;
    const porCat = {};
    m.filter(x => x.tipo === tipo).forEach(x => { porCat[x.cat] = (porCat[x.cat]||0) + x.cents; });
    const filas = Object.entries(porCat).sort((a,b) => b[1]-a[1]);
    const mayor = filas[0][1];
    h += '<h2>'+(tipo === 'gasto' ? 'En qué se ha ido' : 'De dónde ha entrado')+'</h2>';
    filas.forEach(([id,v]) => {
      const c = cat(id);
      h += '<div class="cat">'+
        '<div class="ic" style="background:'+c.color+'22;color:'+c.color+'">'+c.icono+'</div>'+
        '<div class="body"><div class="l1"><span class="nm">'+esc(c.nombre)+'</span><span class="am">'+fmt(v)+'</span></div>'+
        '<div class="b"><i style="width:'+(v/mayor*100)+'%;background:'+c.color+'"></i></div></div>'+
        '<div class="pc">'+Math.round(v/total*100)+'%</div></div>';
    });
  });

  return h;
}

function vMovs(){
  const m = delMes(ym).slice().sort((a,b) => a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : b.id-a.id);
  let h = barraMes();

  if(!m.length){
    h += '<div class="vacio"><p>Ningún movimiento en '+nombreMes(ym)+'.</p>'+
         '<button class="btn" onclick="abrirMov()">Añadir uno</button></div>';
    return h;
  }

  let dia = null;
  m.forEach(x => {
    if(x.fecha !== dia){
      dia = x.fecha;
      const dd = delMes(ym).filter(y => y.fecha === dia);
      const nd = suma(dd,'ingreso') - suma(dd,'gasto');
      const [y,mm,d] = dia.split('-').map(Number);
      const et = new Date(y,mm-1,d).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'short'});
      h += '<div class="dia"><span class="d">'+et+'</span><span class="s">'+fmtFirmado(nd)+'</span></div>';
    }
    const c = cat(x.cat), pos = x.tipo === 'ingreso';
    h += '<div class="mov">'+
      '<div class="ic" style="background:'+c.color+'22;color:'+c.color+'">'+c.icono+'</div>'+
      '<div class="txt"><div class="nm">'+esc(c.nombre)+'</div>'+
      (x.nota ? '<div class="no">'+esc(x.nota)+'</div>' : '')+'</div>'+
      '<div class="am" style="color:'+(pos?'var(--in)':'var(--out)')+'">'+(pos?'+':'−')+fmt(x.cents)+'</div>'+
      '<button class="x" onclick="borrarMov('+x.id+')" aria-label="Borrar movimiento">×</button></div>';
  });
  return h;
}

function vCats(){
  let h = '';
  [['gasto','Gastos'],['ingreso','Ingresos']].forEach(([tipo,tit]) => {
    h += '<h2>'+tit+'</h2>';
    S.cats.filter(c => c.tipo === tipo).forEach(c => {
      const usos = S.movs.filter(x => x.cat === c.id).length;
      h += '<div class="mov">'+
        '<div class="ic" style="background:'+c.color+'22;color:'+c.color+'">'+c.icono+'</div>'+
        '<div class="txt"><div class="nm">'+esc(c.nombre)+'</div>'+
        '<div class="no">'+(usos ? usos+(usos===1?' movimiento':' movimientos') : 'sin usar')+'</div></div>'+
        '<button class="x" onclick="borrarCat(\''+c.id+'\')" aria-label="Borrar categoría">×</button></div>';
    });
  });
  h += '<button class="btn ghost" style="margin-top:22px" onclick="abrirCat()">Nueva categoría</button>';
  return h;
}

function vAjustes(){
  const n = S.movs.length;
  return '<div class="caja"><h3>Datos guardados</h3>'+
    '<p>'+n+(n===1?' movimiento':' movimientos')+' en este dispositivo. Se guardan en el navegador, así que el móvil y el portátil tienen cada uno su copia por ahora.</p></div>'+
    '<div class="caja"><h3>Sincronizar entre dispositivos</h3>'+
    '<p>Pendiente. Toda la lectura y escritura pasa por el objeto <code>disco</code> al principio del script, así que conectar Supabase es sustituir esas dos funciones.</p></div>'+
    '<button class="btn ghost" onclick="exportar()">Descargar copia en CSV</button>'+
    '<button class="btn peligro" onclick="borrarTodo()">Borrar todos los datos</button>';
}

/* --- Evolución ------------------------------------------------ */
function mesesRango(n){
  const [y,m] = hoyISO().slice(0,7).split('-').map(Number), out = [];
  for(let i = n-1; i >= 0; i--){
    const d = new Date(y, m-1-i, 1);
    out.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));
  }
  return out;
}
function mesCorto(m){
  const [y,mm] = m.split('-').map(Number);
  return new Date(y,mm-1,1).toLocaleDateString('es-ES',{month:'short'}).replace('.','').slice(0,3);
}
// tasa de ahorro = porción de los ingresos del mes que no se ha gastado
function ahorroMes(m){
  const mv = delMes(m), ing = suma(mv,'ingreso'), gas = suma(mv,'gasto');
  return { ing, gas, neto: ing-gas, pc: ing ? (ing-gas)/ing*100 : null };
}
function setRango(n){ rango = n; pintar(); }
function toggleCat(id){ abiertas.has(id) ? abiertas.delete(id) : abiertas.add(id); pintar(); }

function vEvolucion(){
  if(!S.movs.length){
    return '<div class="vacio"><p>Todavía no hay historial que comparar. En cuanto tengas un par de meses apuntados, esta pantalla cobra sentido.</p>'+
           '<button class="btn" onclick="abrirMov()">Apuntar un movimiento</button></div>';
  }

  const meses = mesesRango(rango);
  const actual = hoyISO().slice(0,7);
  let h = '<div class="rango">'+
    [6,12].map(n => '<button class="'+(rango===n?'on':'')+'" onclick="setRango('+n+')">'+n+' meses</button>').join('')+
    '</div>';

  /* --- ahorro sobre ingresos, mes a mes --- */
  const datos = meses.map(m => Object.assign({m}, ahorroMes(m)));
  const conDatos = datos.filter(d => d.pc !== null);
  const pcs = conDatos.map(d => d.pc);
  const maxPos = Math.max(10, ...pcs.filter(p => p > 0));
  const maxNeg = Math.max(0, ...pcs.filter(p => p < 0).map(p => -p));
  const fPos = maxPos, fNeg = maxNeg;

  const ingTot = conDatos.reduce((a,d) => a+d.ing, 0);
  const netoTot = conDatos.reduce((a,d) => a+d.neto, 0);
  const media = ingTot ? netoTot/ingTot*100 : null;

  h += '<h2>Ahorro sobre ingresos</h2>';
  h += '<div class="cabAhorro">'+
    '<span class="v" style="color:'+(media!==null&&media<0?'var(--out)':'var(--in)')+'">'+
      (media===null ? '—' : (media>0?'':'−')+Math.abs(Math.round(media))+'%')+'</span>'+
    '<span class="t">de media en '+(conDatos.length||0)+(conDatos.length===1?' mes':' meses')+
      ' con ingresos, o '+fmtFirmado(netoTot)+' guardados</span></div>';

  h += '<div class="evo'+(rango>6?' compacta':'')+'">';
  datos.forEach(d => {
    const alto = d.pc === null ? 0 : d.pc > 0 ? d.pc/maxPos*100 : maxNeg ? -d.pc/maxNeg*100 : 0;
    h += '<div class="col'+(d.m===actual?' act':'')+'"><div class="zona">'+
      '<div class="up" style="flex:'+fPos+'">'+
        (d.pc > 0 ? '<div class="pil" style="height:'+alto+'%;background:var(--in)"></div>' : '')+
      '</div>'+
      (fNeg ? '<div class="dn" style="flex:'+fNeg+'">'+
        (d.pc !== null && d.pc < 0 ? '<div class="pil" style="height:'+alto+'%;background:var(--out)"></div>' : '')+
      '</div>' : '')+
      '</div><div class="lab"><div class="m">'+mesCorto(d.m)+'</div>'+
      '<div class="p" style="color:'+(d.pc===null?'var(--dim)':d.pc<0?'var(--out)':'var(--in)')+'">'+
        (d.pc === null ? '·' : Math.round(d.pc)+'%')+'</div></div></div>';
  });
  h += '</div>';
  if(datos.some(d => d.pc === null))
    h += '<p class="nota">Los meses marcados con · no tienen ingresos apuntados, así que no hay porcentaje que calcular.</p>';

  /* --- gasto por categoría, mes a mes --- */
  const porCat = {};
  meses.forEach(m => delMes(m).filter(x => x.tipo === 'gasto').forEach(x => {
    porCat[x.cat] = porCat[x.cat] || {};
    porCat[x.cat][m] = (porCat[x.cat][m]||0) + x.cents;
  }));

  const filas = Object.entries(porCat).map(([id,mm]) => {
    const serie = meses.map(m => mm[m]||0);
    const total = serie.reduce((a,b) => a+b, 0);
    const ult = serie[serie.length-1];
    const prev = serie.slice(0,-1);
    const mediaPrev = prev.length ? prev.reduce((a,b) => a+b, 0)/prev.length : 0;
    return {id, serie, total, ult, mediaPrev};
  }).sort((a,b) => b.total-a.total);

  h += '<h2 style="margin-top:34px">Gasto por categoría</h2>';
  if(!filas.length) return h + '<p class="nota">Ningún gasto en este periodo.</p>';

  filas.forEach(f => {
    const c = cat(f.id), tope = Math.max(...f.serie, 1);
    const dif = f.mediaPrev ? (f.ult-f.mediaPrev)/f.mediaPrev*100 : null;
    let et = '·', col = 'var(--dim)';
    if(dif !== null && Math.abs(dif) >= 5){
      et = (dif > 0 ? '↑' : '↓') + Math.abs(Math.round(dif)) + '%';
      col = dif > 0 ? 'var(--out)' : 'var(--in)';
    }else if(dif !== null){ et = '='; }
    else if(f.ult){ et = 'nuevo'; col = 'var(--paper)'; }

    h += '<button class="tend" onclick="toggleCat(\''+f.id+'\')" aria-expanded="'+abiertas.has(f.id)+'">'+
      '<span class="ic" style="background:'+c.color+'22;color:'+c.color+'">'+c.icono+'</span>'+
      '<span class="mid"><span class="l1"><span class="nm">'+esc(c.nombre)+'</span>'+
        '<span class="tt">'+fmt(f.total)+'</span></span>'+
      '<span class="spark">'+
        f.serie.map((v,i) => '<i class="'+(i===f.serie.length-1?'ult':'')+'" style="height:'+
          (v/tope*100)+'%;background:'+c.color+'"></i>').join('')+
      '</span></span>'+
      '<span class="delta" style="color:'+col+'">'+et+'</span></button>';

    if(abiertas.has(f.id)){
      h += '<div class="detalle">'+
        meses.map((m,i) => '<div class="r"><span>'+nombreMes(m)+'</span><span'+
          (f.serie[i] ? '' : ' style="color:var(--dim)"')+'>'+
          (f.serie[i] ? fmt(f.serie[i]) : '—')+'</span></div>').join('')+
        '</div>';
    }
  });

  h += '<p class="nota">La flecha compara el último mes con la media de los anteriores del periodo. Toca una categoría para ver los importes mes a mes.</p>';
  return h;
}

function pintar(){
  document.getElementById('hVista').textContent =
    ({resumen:'Resumen',evo:'Evolución',movs:'Movimientos',cats:'Categorías',ajustes:'Ajustes'})[vista];
  app.innerHTML = vista === 'resumen' ? vResumen()
                : vista === 'evo'     ? vEvolucion()
                : vista === 'movs'    ? vMovs()
                : vista === 'cats'    ? vCats()
                : vAjustes();
  document.querySelectorAll('nav button.tab').forEach(b =>
    b.setAttribute('aria-current', b.dataset.v === vista ? 'true' : 'false'));
  const mm = delMes(ym), neto = suma(mm,'ingreso') - suma(mm,'gasto');
  document.getElementById('dwBal').textContent = nombreMes(ym)+': '+fmtFirmado(neto);
  document.getElementById('fab').style.display = vista === 'cats' || vista === 'ajustes' ? 'none' : 'flex';
}

/* ============================================================
   6. ALTA DE MOVIMIENTO
   ============================================================ */
const modal = document.getElementById('modal'), sheet = document.getElementById('sheet');
let tipoNuevo = 'gasto';

function cerrar(){ modal.classList.remove('on'); }
modal.querySelector('.bg').addEventListener('click', cerrar);

function abrirMov(){
  tipoNuevo = 'gasto';
  sheet.innerHTML =
    '<h3>Nuevo movimiento</h3>'+
    '<div class="seg">'+
      '<button id="tGas" class="on" style="background:var(--out)" onclick="setTipo(\'gasto\')">Gasto</button>'+
      '<button id="tIng" onclick="setTipo(\'ingreso\')">Ingreso</button>'+
    '</div>'+
    '<input class="imp num" id="fImp" inputmode="decimal" placeholder="0,00" autocomplete="off">'+
    '<label for="fCat">Categoría</label><select id="fCat"></select>'+
    '<div class="fila2"><div><label for="fFec">Fecha</label><input type="date" id="fFec" value="'+hoyISO()+'"></div></div>'+
    '<label for="fNota">Nota (opcional)</label><input id="fNota" placeholder="Cena con Marieta" autocomplete="off">'+
    '<p class="aviso" id="fErr"></p>'+
    '<button class="btn" onclick="guardarMov()">Guardar movimiento</button>';
  llenarCats();
  modal.classList.add('on');
  setTimeout(() => document.getElementById('fImp').focus(), 120);
}

function setTipo(t){
  tipoNuevo = t;
  const g = document.getElementById('tGas'), i = document.getElementById('tIng');
  g.className = t === 'gasto' ? 'on' : '';
  i.className = t === 'ingreso' ? 'on' : '';
  g.style.background = t === 'gasto' ? 'var(--out)' : 'var(--panel2)';
  i.style.background = t === 'ingreso' ? 'var(--in)' : 'var(--panel2)';
  llenarCats();
}

function llenarCats(){
  const sel = document.getElementById('fCat');
  sel.innerHTML = S.cats.filter(c => c.tipo === tipoNuevo)
    .map(c => '<option value="'+c.id+'">'+esc(c.icono+' '+c.nombre)+'</option>').join('');
}

function guardarMov(){
  const cents = aCentimos(document.getElementById('fImp').value);
  const err = document.getElementById('fErr');
  if(cents === null){ err.textContent = 'Escribe un importe mayor que cero.'; return; }
  const fecha = document.getElementById('fFec').value;
  if(!fecha){ err.textContent = 'Falta la fecha.'; return; }
  S.movs.push({
    id: S.seq++, fecha, tipo: tipoNuevo, cents,
    cat: document.getElementById('fCat').value,
    nota: document.getElementById('fNota').value.trim()
  });
  guardar();
  ym = fecha.slice(0,7);
  cerrar();
  pintar();
}

function borrarMov(id){
  const x = S.movs.find(m => m.id === id);
  if(!x || !confirm('¿Borrar este movimiento de '+fmt(x.cents)+'?')) return;
  S.movs = S.movs.filter(m => m.id !== id);
  guardar(); pintar();
}

/* ============================================================
   7. CATEGORÍAS
   ============================================================ */
function abrirCat(){
  sheet.innerHTML =
    '<h3>Nueva categoría</h3>'+
    '<label for="cNom">Nombre</label><input id="cNom" placeholder="Peluquería" autocomplete="off">'+
    '<label for="cTipo">Tipo</label><select id="cTipo"><option value="gasto">Gasto</option><option value="ingreso">Ingreso</option></select>'+
    '<div class="fila2">'+
      '<div><label for="cIco">Icono</label><input id="cIco" value="•" maxlength="2"></div>'+
      '<div><label for="cCol">Color</label><input type="color" id="cCol" value="#7C8290" style="padding:6px;height:48px"></div>'+
    '</div>'+
    '<p class="aviso" id="cErr"></p>'+
    '<button class="btn" onclick="guardarCat()">Crear categoría</button>';
  modal.classList.add('on');
}

function guardarCat(){
  const nombre = document.getElementById('cNom').value.trim();
  if(!nombre){ document.getElementById('cErr').textContent = 'Ponle un nombre.'; return; }
  S.cats.push({
    id: 'x'+Date.now(), nombre,
    tipo: document.getElementById('cTipo').value,
    color: document.getElementById('cCol').value,
    icono: document.getElementById('cIco').value.trim() || '•'
  });
  guardar(); cerrar(); pintar();
}

function borrarCat(id){
  const usos = S.movs.filter(x => x.cat === id).length;
  if(usos){ alert('Esta categoría tiene '+usos+(usos===1?' movimiento':' movimientos')+'. Cámbialos o bórralos antes.'); return; }
  if(!confirm('¿Borrar la categoría "'+cat(id).nombre+'"?')) return;
  S.cats = S.cats.filter(c => c.id !== id);
  guardar(); pintar();
}

/* ============================================================
   8. AJUSTES
   ============================================================ */
function exportar(){
  const filas = [['fecha','tipo','categoria','importe_eur','nota']].concat(
    S.movs.slice().sort((a,b) => a.fecha < b.fecha ? -1 : 1).map(x =>
      [x.fecha, x.tipo, cat(x.cat).nombre, (x.cents/100).toFixed(2).replace('.',','), x.nota||''])
  );
  const csv = filas.map(f => f.map(v => '"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'}));
  a.download = 'mis-cuentas-'+hoyISO()+'.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

function borrarTodo(){
  if(!confirm('Se borran todos los movimientos y categorías de este dispositivo. ¿Seguro?')) return;
  if(!confirm('Última confirmación: no hay vuelta atrás.')) return;
  S = { movs:[], cats:CATS_INICIALES.slice(), seq:1 };
  guardar(); pintar();
}

/* ============================================================
   9. ARRANQUE
   ============================================================ */
const drawer = document.getElementById('drawer'), veil = document.getElementById('veil');
function abrirDrawer(o){ drawer.classList.toggle('on',o); veil.classList.toggle('on',o); }
document.getElementById('burger').onclick = () => abrirDrawer(true);
veil.onclick = () => abrirDrawer(false);
document.getElementById('fab').onclick = abrirMov;
document.querySelectorAll('nav button.tab').forEach(b => {
  b.onclick = () => { vista = b.dataset.v; abrirDrawer(false); pintar(); };
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ cerrar(); abrirDrawer(false); }
});

cargar().then(pintar);
</script>
